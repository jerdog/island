name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Island
        uses: actions/checkout@v4
        with:
          path: island

      # Sibling checkouts expected by settings.gradle (see CLAUDE.md for why these revisions).
      - name: Check out deagle
        uses: actions/checkout@v4
        with:
          repository: oasisfeng/deagle
          ref: d4767d5e69074b03e641186fa9504be37f09c673    # Contemporary with Island's last code change (April 2021)
          path: deagle
      - name: Check out condom
        uses: actions/checkout@v4
        with:
          repository: oasisfeng/condom
          ref: v2.5.0     # No longer published to any Maven repository since the shutdown of JCenter
          path: condom

      # Before switching to JDK 11, as current sdkmanager requires a newer JDK.
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-30" "build-tools;30.0.3" "build-tools;29.0.2" "build-tools;28.0.3" > /dev/null

      - name: Set up JDK 11   # Gradle 6.5 does not run on newer JDKs
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
          cache-dependency-path: island/**/*.gradle

      - name: Build and lint
        working-directory: island
        run: sh ./gradlew --no-daemon :assembly:assembleCompleteDebug :assembly:lintCompleteDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: island-complete-debug
          path: island/assembly/build/outputs/apk/complete/debug/*.apk
          retention-days: 14
