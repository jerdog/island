// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '1.4.32'
    ext.kotlin_coroutine_version = '1.3.9'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.android.tools.build:gradle:4.1.3'
        classpath 'com.google.gms:google-services:4.3.4'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.4.1'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

if (file('local.gradle').exists()) apply from: 'local.gradle'

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {     // For artifacts only published on JitPack since the shutdown of JCenter
            url 'https://jitpack.io'
            content { includeGroup 'com.github.Chainfire' }
        }
    }

    ext.compileSdkVersion = 30
    ext.minSdkVersion = 24
}

// Stub classes of framework in "condom" must not leak into the classpath of dependents (built from source, see settings.gradle)
if (findProject(':condom')) project(':condom') { afterEvaluate { android.libraryVariants.all { variant ->
    variant.javaCompileProvider.configure { task -> task.doLast { delete new File(task.destinationDir, 'android') } }
}}}
